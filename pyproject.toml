[project]
name = "jpeg-training"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==2.3.5", "Pillow==11.3.0"]

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["support"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
